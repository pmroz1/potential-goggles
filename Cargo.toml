[workspace]
resolver = "3"
members = ["crates/editor-core", "crates/media", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
editor-core = { path = "crates/editor-core" }
media = { path = "crates/media" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
